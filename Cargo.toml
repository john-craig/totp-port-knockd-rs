[package]
name = "totp-port-knockd-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.30", features = ["derive"]}
fork = "0.2.0"
hmac = "0.12.1"
iptables = "0.5.3"
log = "0.4.26"
nix = { version = "0.29.0", features = ["signal"]}
psocket = "0.1.5"
regex = "1.11.1"
serde = { version = "1.0.218", features = ["derive", "std"]}
serde_json = "1.0.139"
sha2 = "0.10.8"
sha256 = "1.5.0"
signal-hook = "0.3.17"
simple_logger = "5.0.0"
syslog = "7.0.0"
toml = "0.8.20"
totp-rs = "5.6.0"
which = "7.0.2"

[[bin]]
name = "totp-knockd"
path = "src/cmds/totp-knockd.rs"

[[bin]]
name = "totp-knocker"
path = "src/cmds/totp-knocker.rs"
